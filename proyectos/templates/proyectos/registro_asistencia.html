<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro en Campo - {{ proyecto.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { background-color: #f4f6f9; }
        .codigo-input { font-size: 2rem; text-align: center; letter-spacing: 5px; font-weight: bold; }
        #reader { width: 100%; border-radius: 10px; overflow: hidden; display: none; margin-bottom: 15px; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="card shadow-sm w-100" style="max-width: 400px; border-radius: 15px;">
        <div class="card-header bg-primary text-white text-center py-3" style="border-radius: 15px 15px 0 0;">
            <h5 class="mb-0">Control de Asistencia</h5>
            <small>{{ proyecto.nombre }}</small>
        </div>
        
        <div class="card-body p-4">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-danger{% endif %} text-center">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" id="form-asistencia">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">1. Selecciona tu perfil</label>
                    <select name="recurso_id" class="form-select form-select-lg" required>
                        <option value="" disabled selected>Busca tu nombre...</option>
                        {% for r in recursos %}
                            <option value="{{ r.id }}">{{ r.nombre }} - {{ r.perfil.nombre|default:"Técnico" }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label text-muted fw-bold">2. Tipo de Registro</label>
                    <div class="d-flex gap-2">
                        <input type="radio" class="btn-check" name="tipo_registro" id="entrada" value="ENTRADA" checked>
                        <label class="btn btn-outline-success w-100" for="entrada">🟢 ENTRADA</label>

                        <input type="radio" class="btn-check" name="tipo_registro" id="salida" value="SALIDA">
                        <label class="btn btn-outline-danger w-100" for="salida">🔴 SALIDA</label>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted fw-bold">3. Escanear o Digitar</label>
                    
                    <div id="reader"></div>
                    <button type="button" id="btn-scan" class="btn btn-dark w-100 mb-2">📷 Abrir Escáner QR</button>
                    
                    <div class="text-center text-muted mb-2"><small>o ingresa el código manual</small></div>
                    <input type="text" name="codigo" id="input-codigo" class="form-control codigo-input" placeholder="000000" maxlength="6" autocomplete="off" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">Validar Asistencia</button>
            </form>
        </div>
    </div>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const btnScan = document.getElementById('btn-scan');
        const inputCodigo = document.getElementById('input-codigo');
        const readerDiv = document.getElementById('reader');
        let camaraEncendida = false;

        btnScan.addEventListener('click', () => {
            if (camaraEncendida) {
                // Si ya está encendida, la apagamos
                html5QrCode.stop().then(() => {
                    readerDiv.style.display = "none";
                    btnScan.innerText = "📷 Abrir Escáner QR";
                    camaraEncendida = false;
                });
                return;
            }

            // Encendemos la cámara
            readerDiv.style.display = "block";
            btnScan.innerText = "Apagar Cámara";
            camaraEncendida = true;

            html5QrCode.start(
                { facingMode: "environment" }, // Prioriza la cámara trasera del celular
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    // ¡ÉXITO! Leyó el QR
                    html5QrCode.stop(); // Apagamos la cámara
                    readerDiv.style.display = "none";
                    btnScan.innerText = "📷 Abrir Escáner QR";
                    camaraEncendida = false;
                    
                    // Llenamos el input con el código que leímos del QR
                    inputCodigo.value = decodedText;
                    
                    // Mostramos un mensajito verde para que el usuario sepa que funcionó
                    inputCodigo.style.backgroundColor = "#d1e7dd";
                    setTimeout(() => inputCodigo.style.backgroundColor = "", 1000);
                },
                (errorMessage) => {
                    // Ignoramos los errores de lectura normales mientras busca el QR
                }
            ).catch((err) => {
                alert("Error al acceder a la cámara. Asegúrate de darle permisos al navegador.");
                readerDiv.style.display = "none";
                btnScan.innerText = "📷 Abrir Escáner QR";
                camaraEncendida = false;
            });
        });
    </script>
</body>
</html>
