<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Asistencia - {{ proyecto.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .codigo-gigante { font-size: 5rem; font-weight: bold; letter-spacing: 10px; color: #0d6efd;}
        .reloj { font-size: 1.5rem; color: #dc3545; font-weight: bold; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow-lg text-center p-5" style="border-radius: 20px; max-width: 600px; width: 100%;">
        <h2 class="mb-1 text-uppercase">{{ proyecto.nombre }}</h2>
        <p class="text-muted mb-4">Registro de Asistencia en Campo</p>

        <div id="qr-container" class="d-flex justify-content-center mb-4"></div>

        <p class="text-muted mb-0">Código Manual (Plan B)</p>
        <div class="codigo-gigante" id="codigo-texto">------</div>
        
        <div class="mt-3 reloj">
            Cambia en: <span id="tiempo-restante">--</span>s
        </div>
    </div>

    <script>
        // 1. Inicializamos el QR vacío
        const qrContainer = document.getElementById("qr-container");
        let qrCode = new QRCode(qrContainer, {
            text: "Cargando...",
            width: 250,
            height: 250,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        // 2. Lógica de actualización en tiempo real
        function actualizarCodigo() {
            fetch("{% url 'api_codigo_actual' proyecto.id %}")
                .then(response => response.json())
                .then(data => {
                    // Actualizamos el texto gigante y el reloj
                    document.getElementById('codigo-texto').innerText = data.codigo;
                    document.getElementById('tiempo-restante').innerText = data.tiempo_restante;
                    
                    // ¡NUEVO! Actualizamos el dibujo del QR para que contenga el número actual
                    qrCode.clear();
                    qrCode.makeCode(data.codigo);
                })
                .catch(error => console.error("Error obteniendo código:", error));
        }

        // Llamar inmediatamente y luego cada 1 segundo
        actualizarCodigo();
        setInterval(actualizarCodigo, 1000);
    </script>

</body>
</html>
